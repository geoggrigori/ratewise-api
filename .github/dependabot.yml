version: 2
updates:
  - package-ecosystem: npm
    directory: /
    ignore:
      # Major bumps need manual migration; only minor/patch are proposed automatically.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
